<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🍳 冷蔵庫レシピ</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="app-header">
  <h1>🍳 冷蔵庫レシピ</h1>
  <div class="header-actions">
    <button class="btn-ghost" id="btn-history" onclick="openHistory()">📚 履歴<span class="count" id="hist-count"></span></button>
    <button class="btn-reset" onclick="resetAll()">🗑 リセット</button>
  </div>
</header>

<!-- Form -->
<div class="form-card">
  <div class="form-group">
    <label class="form-label">冷蔵庫の食材</label>
    <div class="tag-input-wrap" id="tag-wrap">
      <input type="text" id="ingredient-input" placeholder="例: 鶏肉、にんじん…（Enterで追加）">
    </div>
    <p class="tag-hint">Enterキー または カンマで追加。クリックで削除。</p>
  </div>

  <div class="form-group">
    <label class="form-label" for="mood">今の気分・食べたいもの</label>
    <input type="text" id="mood" placeholder="例: さっぱりしたい、がっつり食べたい、エスニック系">
  </div>

  <div class="row2">
    <div class="form-group">
      <label class="form-label" for="servings">人数</label>
      <select id="servings">
        <option value="1">1人前</option>
        <option value="2" selected>2人前</option>
        <option value="3">3人前</option>
        <option value="4">4人前</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="max-time">調理時間の目安</label>
      <select id="max-time">
        <option value="">特になし</option>
        <option value="15分以内">15分以内</option>
        <option value="30分以内">30分以内</option>
        <option value="1時間以内">1時間以内</option>
      </select>
    </div>
  </div>

  <div class="row2">
    <div class="form-group">
      <label class="form-label" for="drink">手元にあるお酒（省略可）</label>
      <input type="text" id="drink" placeholder="例: 獺祭、サッポロ黒ラベル">
    </div>
    <div class="form-group">
      <label class="form-label" for="model">提案の質</label>
      <select id="model"></select>
    </div>
  </div>

  <button class="btn-suggest" id="btn-suggest" onclick="suggest()">✨ レシピを提案する</button>
</div>

<div class="toast" id="toast"></div>

<!-- Substitution modal -->
<div class="modal-overlay" id="sub-modal" onclick="closeModal(event)">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="食材の変更">
    <div class="modal-title">食材の変更</div>
    <div class="modal-ing" id="modal-ing-name"></div>
    <div class="modal-opts" id="modal-opts"></div>
    <button class="modal-close" onclick="closeSubModal()">閉じる</button>
  </div>
</div>

<!-- Kept dish detail (full recipe card with chat / update / timer) -->
<div class="panel-overlay" id="kept-modal">
  <div class="panel" role="dialog" aria-modal="true" aria-label="保存したレシピ">
    <div class="panel-head">
      <div class="panel-title">📖 保存したレシピ</div>
      <button class="panel-close" onclick="closeKeptModal()" aria-label="閉じる">✕</button>
    </div>
    <div id="kept-modal-body"></div>
  </div>
</div>

<!-- History panel -->
<div class="panel-overlay" id="history-panel">
  <div class="panel" role="dialog" aria-modal="true" aria-label="決定した献立の履歴">
    <div class="panel-head">
      <div class="panel-title">📚 決定した献立<span id="hist-total"></span></div>
      <button class="panel-close" onclick="closeHistory()" aria-label="閉じる">✕</button>
    </div>
    <div class="panel-tools">
      <input type="search" id="hist-search" placeholder="レシピ名・食材で検索" oninput="renderHistoryGrid()">
      <select id="hist-sort" onchange="renderHistoryGrid()">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
        <option value="title">名前順</option>
        <option value="time">時間が短い順</option>
      </select>
    </div>
    <div class="hist-chips" id="hist-chips"></div>
    <div class="hist-grid" id="hist-grid"></div>
    <div class="hist-bar" id="hist-bar">
      <span class="mb-count" id="hist-mb-count">0件選択中</span>
      <button class="sub" onclick="clearHistSelection()">解除</button>
      <button onclick="shoppingFromHistory()">🛒 買い物リスト</button>
      <button onclick="timelineFromHistory()">⏱ 並行調理</button>
    </div>
    <div class="panel-foot">
      <button onclick="exportHistory('text')">📋 全部コピー</button>
      <button onclick="exportHistory('json')">⬇ JSONで保存</button>
      <button onclick="importHistoryPrompt()">⬆ JSONから復元</button>
    </div>
  </div>
</div>

<!-- Shopping list panel -->
<div class="panel-overlay" id="shopping-panel">
  <div class="panel" role="dialog" aria-modal="true" aria-label="買い物リスト">
    <div class="panel-head">
      <div class="panel-title">🛒 買い物リスト</div>
      <button class="panel-close" onclick="closePanel('shopping-panel')" aria-label="閉じる">✕</button>
    </div>
    <div id="shopping-body"></div>
    <div class="panel-foot">
      <button onclick="copyShoppingList()">📋 コピー</button>
    </div>
  </div>
</div>

<!-- Timeline panel -->
<div class="panel-overlay" id="timeline-panel">
  <div class="panel" role="dialog" aria-modal="true" aria-label="並行調理タイムライン">
    <div class="panel-head">
      <div class="panel-title">⏱ 並行調理タイムライン</div>
      <button class="panel-close" onclick="closePanel('timeline-panel')" aria-label="閉じる">✕</button>
    </div>
    <div id="timeline-body"></div>
  </div>
</div>

<!-- Error -->
<div class="error-box" id="error-box"></div>

<!-- Loading -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-msg" id="loading-msg">✨ 食材の組み合わせを考えています…</div>
  <div class="summary-row" id="skeleton-row">
    <div class="sum-card sk-card">
      <div class="sk" style="height:12px;width:36%;margin-bottom:10px"></div>
      <div class="sk" style="height:20px;width:85%;margin-bottom:10px"></div>
      <div class="sk" style="height:12px;width:95%;margin-bottom:6px"></div>
      <div class="sk" style="height:12px;width:70%"></div>
    </div>
    <div class="sum-card sk-card">
      <div class="sk" style="height:12px;width:36%;margin-bottom:10px"></div>
      <div class="sk" style="height:20px;width:70%;margin-bottom:10px"></div>
      <div class="sk" style="height:12px;width:95%;margin-bottom:6px"></div>
      <div class="sk" style="height:12px;width:60%"></div>
    </div>
    <div class="sum-card sk-card">
      <div class="sk" style="height:12px;width:36%;margin-bottom:10px"></div>
      <div class="sk" style="height:20px;width:78%;margin-bottom:10px"></div>
      <div class="sk" style="height:12px;width:95%;margin-bottom:6px"></div>
      <div class="sk" style="height:12px;width:65%"></div>
    </div>
  </div>
</div>

<!-- Results -->
<div id="results"></div>

<!-- 複数選択ツールバー -->
<div class="multi-bar" id="multi-bar">
  <span class="mb-count" id="mb-count">0件選択中</span>
  <button class="sub" onclick="clearSelection()">解除</button>
  <button onclick="openShoppingList()">🛒 買い物リスト</button>
  <button onclick="openTimeline()">⏱ 並行調理</button>
  <button onclick="keepSelected()">✅ まとめて決定</button>
</div>

<footer class="app-footer">
  <p id="deploy-info"></p>
</footer>

<script src="/app.js"></script>
</body>
</html>
